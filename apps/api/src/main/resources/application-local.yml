spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:file:./target/enviora_local_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc.time_zone: UTC

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:426875584271-o6h5es6pth16gr14uadumss9ll98gbgi.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}

  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  security:
    email-verification:
      expiration-minutes: 1440 # 24 hours for local development testing

logging:
  level:
    root: INFO
    com.enviora: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
