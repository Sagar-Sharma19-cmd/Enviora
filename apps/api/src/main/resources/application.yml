spring:
  application:
    name: enviora-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:enviora_db}
    username: ${POSTGRES_USER:enviora_user}
    password: ${POSTGRES_PASSWORD:enviora_dev_password_change_me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

app:
  jwt:
    secret: ${JWT_SECRET:dGhpc19pc19hX3NhbXBsZV9kZXZlbG9wbWVudF9qd3Rfc2VjcmV0X2tleV9mb3JfZW52aW9yYV9wbGF0Zm9ybV8xMjM0NTY3ODkw}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  encryption:
    master-key: ${ENCRYPTION_KEY:c2FtcGxlX21hc3Rlcl9lbmNyeXB0aW9uX2tleV8zMmJ5dGVzIQ==}
