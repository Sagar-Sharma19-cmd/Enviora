version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: enviora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enviora_db}
      POSTGRES_USER: ${POSTGRES_USER:-enviora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enviora_dev_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enviora_user} -d ${POSTGRES_DB:-enviora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enviora-network

  redis:
    image: redis:7-alpine
    container_name: enviora-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enviora-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: enviora-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Mailpit Web UI
      - "1025:1025" # Mailpit SMTP Server
    networks:
      - enviora-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  enviora-network:
    driver: bridge
